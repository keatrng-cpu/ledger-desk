<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install {{APP_NAME}}</title>
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/__grok/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #f5f5f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        width: 100%;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 8px;
      }
      p.sub {
        color: #a1a1aa;
        font-size: 0.9rem;
        margin-bottom: 24px;
      }
      ol {
        list-style: none;
        counter-reset: step;
        display: grid;
        gap: 14px;
        margin-bottom: 28px;
      }
      ol li {
        counter-increment: step;
        display: flex;
        gap: 12px;
        align-items: baseline;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      ol li::before {
        content: counter(step);
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #27272a;
        color: #e4e4e7;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transform: translateY(4px);
      }
      a.open {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: #f5f5f5;
        color: #000;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Install {{APP_NAME}}</h1>
      <p class="sub">Add this app to your Home Screen for a full-screen experience.</p>
      <ol>
        <li>Tap the <strong>Share</strong> button in your browser toolbar.</li>
        <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
        <li>Tap <strong>Add</strong> — then launch {{APP_NAME}} from your Home Screen.</li>
      </ol>
      <a class="open" href="{{APP_URL}}">Continue in browser</a>
    </main>
  </body>
</html>
