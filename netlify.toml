# Netlify deploy for Ledger Profit Desk (TanStack Start + Nitro)
# Connect this repo at https://app.netlify.com → Add new site → Import from GitHub
# Repo: keatrng-cpu/ledger-desk · branch: main

[build]
  command = "npm run build"
  publish = "dist"
  # Nitro netlify preset is auto-selected when NETLIFY=true (set by Netlify CI).
  # See vite.config.ts nitro preset switch.

[build.environment]
  NODE_VERSION = "22"
  # Skip optional heavy local tooling if any
  NPM_FLAGS = "--legacy-peer-deps"

# SPA / SSR: Nitro emits the correct redirects for Functions.
# Explicit catch-all only if you ever switch to pure static (not recommended).

# Serverless functions timeout — desk fetches Databento/Yahoo can be slow
[functions]
  node_bundler = "esbuild"
  # Free: 10s · Pro: up to 26s (or 900s background). Raise if desk load times out.
  # directory is produced by Nitro into .netlify/functions-internal

# Headers: no-cache for the HTML shell so you never fight stale Masterplace UI
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A cached service worker cannot replace itself — it is the one stale artifact
# that survives a hard refresh.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# exec-flatten and room-step are scheduled functions
# (netlify/functions/*.mjs). The build copies them into
# .netlify/functions-internal beside Nitro's SSR function.
# exec-flatten rings GET /api/cron/exec-flatten. It opens nothing.
# room-step rings GET /api/cron/room-step: one paper cycle, no broker.
# Neither does anything until CRON_SECRET is set. The flatten route still
# no-ops unless the execution phase is paper or live.
#
# Scheduled jobs (the other crons still need a caller). Netlify does not read
# vercel.json. Do not point functions.directory at netlify/functions — that
# drops the SSR function Nitro writes.
# [[plugins]]
#   package = "@netlify/plugin-scheduled-functions"
#
# Or use Netlify UI → Functions → Scheduled:
#   GET /.netlify/functions/...  OR your SSR paths:
#   /api/cron/checklist  — 15 13,14 * * 1-5  (UTC)
#   /api/cron/review     — 15 20,21 * * 1-5
#   /api/cron/weekly     — 0 22,23 * * 0
