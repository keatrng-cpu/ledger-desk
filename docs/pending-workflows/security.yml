# Secret and Python-security scans. Read-only: nothing here writes to the repo, comments, or uses a secret.
# Gitleaks is downloaded from its official release and checked against a pinned SHA-256 before it runs (a moving download is a supply-chain hole).
# Bandit is pinned. Both fail the job; the job never deploys anything.
name: Security scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks (checksum pinned)
        env:
          GL_VERSION: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the history (findings are redacted in the log)
        run: ./gitleaks detect --source . -c .gitleaks.toml --redact --no-banner
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit (fails on Medium and above)
        run: |
          python -m pip install --quiet "bandit==1.9.4"
          bandit -r brainlab gateway -x brainlab/.venv -ll -q
